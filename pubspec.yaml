
name: shopping_cart
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.6
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_native_splash:
  color: "#F8F3FF"
  image: assets/splash_screen/splash_screen.png

  android: true
  ios: true

  android_12:
    color: "#F8F3FF"
    image: assets/splash_screen/splash_screen.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Product_logo.png"
  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Product_logo.png"